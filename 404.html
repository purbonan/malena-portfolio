<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Malena Salgado</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,900&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0E0B0A;
      --text: #E8D9C4;
      --muted: #C9BBA8;
      --gold: #B8935A;
      --accent: #A51D24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Fraunces", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .code {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }
    .code::before {
      content: "—— ";
      color: var(--gold);
    }
    h1 {
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      font-variation-settings: "SOFT" 60, "opsz" 144;
      margin-bottom: 1rem;
    }
    p {
      font-style: italic;
      font-weight: 300;
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 40ch;
      margin-bottom: 2rem;
    }
    a {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      padding: 1rem 2rem;
      border: 1px solid var(--text);
      text-decoration: none;
      transition: all 0.3s ease;
    }
    a:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <p class="code">Error 404</p>
  <h1>Fuera<br>de plano</h1>
  <p>Este encuadre no existe. Quizá quedó en la sala de montaje.</p>
  <a href="/malena-portfolio/">Volver al inicio →</a>
</body>
</html>
